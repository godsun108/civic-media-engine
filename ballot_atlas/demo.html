<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballot Atlas — Demonstration</title><style>body{font:16px system-ui;max-width:1000px;margin:auto;padding:24px;background:#f7f8fa;color:#18202a}header{border-bottom:2px solid #253d59;padding-bottom:16px}.notice{background:#fff2d2;padding:12px;border-radius:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:24px}article{background:white;border:1px solid #d5dce3;border-radius:12px;padding:18px}small{color:#52616f}dt{font-weight:bold;margin-top:12px}dd{margin:4px 0 12px}a{color:#164c8c}</style><header><h1>Ballot Atlas</h1><p>Understand the candidates. Inspect the evidence. Make your own decision.</p></header><p class="notice"><strong>FICTIONAL DESIGN DEMO.</strong> These candidates, policies and positions are invented to illustrate the interface. This is not a live ballot, election guide, or endorsement.</p><label>Compare by issue <select id="issue"><option value="all">All issues</option><option>Water</option><option>Housing</option><option>Agriculture</option></select></label><main id="profiles"></main><script>const candidates=[{name:"Alex Example",office:"Illustrative Florida office",positions:{Water:"Supports restoration grants",Housing:"Supports zoning reform",Agriculture:"Supports hemp research"}},{name:"Jordan Sample",office:"Illustrative Florida office",positions:{Water:"Prioritizes infrastructure upgrades",Housing:"Supports rental assistance",Agriculture:"Supports agricultural extension programs"}}];const root=document.getElementById("profiles"),select=document.getElementById("issue");function render(){root.replaceChildren();for(const c of candidates){const card=document.createElement("article");const h=document.createElement("h2");h.textContent=c.name;card.append(h);const sub=document.createElement("small");sub.textContent=c.office;card.append(sub);const dl=document.createElement("dl");for(const [k,v] of Object.entries(c.positions)){if(select.value!=="all"&&k!==select.value)continue;const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=k;dd.textContent=v+" — fictional demonstration; no real-world source";dl.append(dt,dd)}card.append(dl);root.append(card)}}select.addEventListener("change",render);render();</script></html>
